                    - ATL_DB_PORT=${DBEndpointPort}
                    - DBEndpointPort: !If
                        - DBEngineAurora
                        - !GetAtt DBCluster.Outputs.RDSEndPointPort
                        - !GetAtt DB.Endpoint.Port
                  - !Sub
                    - ATL_JDBC_URL=jdbc:postgresql://${DBEndpointAddress}:${DBEndpointPort}/bitbucket
                    - DBEndpointAddress: !If
                        - DBEngineAurora
                        - !GetAtt DBCluster.Outputs.RDSEndPointAddress
                        - !GetAtt DB.Endpoint.Address
