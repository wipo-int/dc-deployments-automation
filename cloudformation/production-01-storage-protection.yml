Resources:
  AnsiblePinnedShaPutPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SSMParameterPutAccess
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - ssm:PutParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/pinned-ansible-sha
      Roles:
        - !Ref BitbucketClusterNodeRole

  # EC2
  BitbucketClusterNodeRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - EIAMPolicyWildcardResource
          ignore_reasons:
            - EIAMPolicyWildcardResource: Intent assumed for initial migration.
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
      Path: /
      Policies:
        - PolicyName: BitbucketClusterNodePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action:
                  - autoscaling:DescribeTags
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:CreateTags
                Effect: Allow
                Resource:
                  - '*'
              - Action:
                  - autoscaling:CreateOrUpdateTags
                Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:autoscaling:*:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/*
              - Action:
                  - s3:GetObject
                  - s3:ListBucket
                Effect: Allow
                Resource:
                  - arn:aws:s3:::wipo-crowdstrike-bucket
                  - arn:aws:s3:::wipo-crowdstrike-bucket/*
                  - !Sub arn:aws:s3:::atlassian-portfolio-quickstart-${AWS::Region}-${AWS::AccountId}
                  - !Sub arn:aws:s3:::atlassian-portfolio-quickstart-${AWS::Region}-${AWS::AccountId}/*
  BitbucketClusterNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref BitbucketClusterNodeRole
  ClusterNodeGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: !Ref ClusterNodeMin
        Timeout: PT30M
    Properties:
      DesiredCapacity: !If
        - StandbyMode
        - '0'
        - !Ref ClusterNodeMin
      LaunchConfigurationName: !Ref ClusterNodeLaunchConfig
      MinSize: !If
        - StandbyMode
        - '0'
        - !Ref ClusterNodeMin
      MaxSize: !Ref ClusterNodeMax
    #TargetGroupARNs: [!Ref MainTargetGroup]
      LoadBalancerNames:
        - !Ref LoadBalancer
      VPCZoneIdentifier:
        - !Ref LbSubnet1
        - !Ref LbSubnet2
        - !Ref LbSubnet3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Bitbucket Node
          PropagateAtLaunch: true
        - Key: Cluster
          Value: !Ref AWS::StackName
          PropagateAtLaunch: true
        - Key: atl:quickstart:commit-id
          Value: 'COMMIT: 1ab73837b650a79665ca974ceb37e4088eee21b2'
          PropagateAtLaunch: true
        - Key: atl:quickstart:timestamp
          Value: 'TIMESTAMP: 2021-11-25T07:12:04Z'
          PropagateAtLaunch: true
        - Key: service
          Value: atlassian
          PropagateAtLaunch: true
        - Key: schedule
          Value: 'no'
          PropagateAtLaunch: true
  ClusterNodeLaunchConfig:
    Type: AWS::AutoScaling::LaunchConfiguration
    DependsOn:
      - EFSMountAz1
      - EFSMountAz2
      - AnsibleRepoPinSHA
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/atl:
              content:
                !Join
                - "\n"
                -
                  - ATL_PRODUCT=bitbucket
                  - ATL_APP_DATA_MOUNT_ENABLED=false
                  - !Sub ["ATL_EFS_ID=${ElasticFileSystem}", ElasticFileSystem: !Ref "ElasticFileSystem"]
                  - !Sub
                    - ATL_PRODUCT_VERSION=${BitbucketVersion}
                    - BitbucketVersion: !Ref BitbucketVersion
                  - !If
                    - IsBBAdminPasswordProvided
                    - !Sub
                      - ATL_BB_ADMIN_PASSWORD=${BBAdminPassword}
                      - BBAdminPassword: !Ref BitbucketAdminPassword
                    - !Ref AWS::NoValue
                  - !If
                    - IsLicenseKeyProvided
                    - !Sub
                      - ATL_BB_LICENSEKEY='${LicenseKey}'
                      - LicenseKey: !Ref BitbucketLicenseKey
                    - !Ref AWS::NoValue
                  - !If
                    - IsURLProvided
                    - !Sub
                      - ATL_DATASET_URL=${DatasetURL}
                      - DatasetURL: !Ref BitbucketDatasetURL
                    - !Ref AWS::NoValue
                  - !Sub
                    - ATL_BB_BASEURL=${BaseURL}
                    - BaseURL: !If
                        - UseCustomDnsName
                        - !Sub
                          - ${HTTP}://${CustomDNSName}
                          - HTTP: !If
                              - DoSSL
                              - https
                              - http
                            CustomDNSName: !Ref CustomDnsName
                        - !Sub
                          - ${HTTP}://${LoadBalancerDNSName}
                          - HTTP: !If
                              - DoSSL
                              - https
                              - http
                            LoadBalancerDNSName: !GetAtt LoadBalancer.DNSName
                  - !Sub
                    - ATL_PROXY_NAME=${AtlProxyName}
                    - AtlProxyName: !If
                        - UseCustomDnsName
                        - !Ref CustomDnsName
                        - !GetAtt LoadBalancer.DNSName
                  - !Sub
                    - ATL_DEPLOYMENT_REPOSITORY=${DeployRepository}
                    - DeployRepository: !Ref DeploymentAutomationRepository
                  - !Sub
                    - ATL_DEPLOYMENT_REPOSITORY_BRANCH=${DeployRepositoryBranch}
