                        - DBEnginePostgres
                        - !Ref DBSubnetGroup
                        - ''
                  - !Sub
                    - ATL_RDS_SECURITY_GROUP=${SecurityGroup}
                    - SecurityGroup: !Ref SecurityGroup
                  - ''
#                  - !Sub
#                    - ATL_ELASTICSEARCH_HOST=${ESEndpoint}
#                    - ESEndpoint: !If
#                        - UseFineGrainedAccessControlES
#                        - !GetAtt ElasticsearchSecure.DomainEndpoint
#                        - !GetAtt Elasticsearch.DomainEndpoint
                  - !Sub
                    - ATL_ELASTICSEARCH_PROTOCOL=${ESScheme}
                    - ESScheme: !If
                        - UseFineGrainedAccessControlES
                        - https
                        - http
                  - !If
                    - UseFineGrainedAccessControlES
                    - ATL_ELASTICSEARCH_USERNAME=bitbucket
                    - !Ref AWS::NoValue
                  - !If
                    - UseFineGrainedAccessControlES
                    - !Sub
                      - ATL_ELASTICSEARCH_PASSWORD=${ESPassword}
                      - ESPassword: !Ref ElasticSearchPassword
                    - !Ref AWS::NoValue
                  - ''
                  - !Sub
                    - ATL_BITBUCKET_PROPERTIES="${BitbucketProperties}"
                    - BitbucketProperties: !Ref BitbucketProperties
                  - !If
                    - DoSSL
                    - ATL_SSL_PROXY=true
                    - !Ref AWS::NoValue
                  - ''
                  - !Sub
                    - ATL_AWS_ENABLE_CLOUDWATCH=${EnableCW}
                    - EnableCW: !If
                        - EnableCloudWatch
                        - true
                        - false
                  - !Sub
                    - ATL_AWS_ENABLE_CLOUDWATCH_LOGS=${EnableCWLogs}
                    - EnableCWLogs: !If
                        - EnableCloudWatchLogs
                        - true
                        - false
            /opt/atlassian/bin/clone_deployment_repo:
              content: !Sub |
                #!/bin/bash
                key_location=/root/.ssh/deployment_repo_key
                key_name="${DeploymentAutomationKeyName}"
                bitbucket_version="${BitbucketVersion}"
                ssm_pin=/${AWS::StackName}/pinned-ansible-sha
                source /etc/os-release
                bitbucket_minor_version=$(echo "$bitbucket_version" | cut -d. -f-2)
                case "$bitbucket_minor_version" in
                  6.0)  supported_git_version="2.17.2" ;;
                  6.1)  supported_git_version="2.17.2" ;;
                  6.1)  supported_git_version="2.17.2" ;;
                  6.2)  supported_git_version="2.17.2" ;;
                  6.3)  supported_git_version="2.17.2" ;;
                  6.4)  supported_git_version="2.17.2" ;;
                  6.5)  supported_git_version="2.17.2" ;;
                  6.6)  supported_git_version="2.23.1" ;;
                  6.7)  supported_git_version="2.23.4" ;;
                  6.8)  supported_git_version="2.23.4" ;;
                  6.9)  supported_git_version="2.23.4" ;;
                  6.10) supported_git_version="2.23.4" ;;
                  7.0)  supported_git_version="2.23.4" ;;
                  7.1)  supported_git_version="2.23.4" ;;
                  7.2)  supported_git_version="2.23.4" ;;
                  7.3)  supported_git_version="2.23.4" ;;
                  7.4)  supported_git_version="2.23.4" ;;
                  7.5)  supported_git_version="2.23.4" ;;
                  7.6)  supported_git_version="2.23.4" ;;
                  7.7)  supported_git_version="2.23.4" ;;
                  7.8)  supported_git_version="2.23.4" ;;
                  7.9)  supported_git_version="2.23.4" ;;
                  7.10) supported_git_version="2.23.4" ;;
                  7.11) supported_git_version="2.23.4" ;;
                  7.12) supported_git_version="2.23.4" ;;
                  7.13) supported_git_version="2.23.4" ;;
                  7.14) supported_git_version="2.32.0" ;;
                  7.15) supported_git_version="2.32.0" ;;
                  7.16) supported_git_version="2.32.0" ;;
                  7.17) supported_git_version="2.32.0" ;;
                  7.18) supported_git_version="2.32.0" ;;
                  7.19) supported_git_version="2.34.3" ;;
                  7.20) supported_git_version="2.34.3" ;;
                  7.21) supported_git_version="2.34.3" ;;
                  8.0)  supported_git_version="2.34.3" ;;
                  8.1)  supported_git_version="2.34.3" ;;
                  8.2)  supported_git_version="2.34.3" ;;
                  8.3)  supported_git_version="2.37.1" ;;
                  9.4)  supported_git_version="2.47.3" ;;
                    *)  supported_git_version="2.47.3" ;;
                esac
                if [[ "$ID" == "amzn" ]] && [[ "$VERSION_ID" == "2023" ]]; then
                    dnf install -y git awscli-2 jq
                else
                    yum install -y git-"$supported_git_version" awscli jq
                fi
                if [[ ! -z "$key_name" ]]; then
                    # Ensure awscli is up to date
                    key_val=$(aws --region=${AWS::Region} ssm get-parameters --names "$key_name" --with-decryption | jq --raw-output '.Parameters[0].Value')
                    echo -e "$key_val" > $key_location
                    chmod 600 $key_location
                    export GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i $key_location"
                else
                    export GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
                fi
                ### Ansible repo pinning ###
                pinned_commit_id=$(aws --region=${AWS::Region} ssm get-parameters --names "$ssm_pin" | jq --raw-output '.Parameters[0].Value')
                git clone "${DeploymentAutomationRepository}" -b "${DeploymentAutomationBranch}" /opt/atlassian/dc-deployments-automation/
                cd /opt/atlassian/dc-deployments-automation/
                aws s3 cp s3://${QSS3BucketName}/JiraInstall/dc-deployments-automation/aws_bitbucket_dc_node.yml /opt/atlassian/dc-deployments-automation/aws_bitbucket_dc_node.yml

              mode: '000750'
              owner: root
              group: root
          commands:
            070_create_atl_dir:
              test: test ! -d /opt/atlassian/
              command: mkdir -p /opt/atlassian
              ignoreErrors: false
            071_install_packages:
              command: |
                . /etc/os-release
                if [ "$ID" = "amzn" ] && [ "$VERSION_ID" = "2023" ]; then
                  dnf install -y htop
                else
                  yum install -y python-virtualenv htop
                fi
              ignoreErrors: true
            072_clone_atl_scripts:
              test: test ! -d /opt/atlassian/dc-deployments-automation/
              command: /opt/atlassian/bin/clone_deployment_repo
              ignoreErrors: true
            080_run_atl_init_node:
              command: !Sub |
                aws s3 sync s3://${QSS3BucketName}/${QSS3KeyPrefix}/dc-deployments-automation/ /opt/atlassian/dc-deployments-automation/
                cd /opt/atlassian/dc-deployments-automation/ && bash ./bin/install-ansible && bash ./bin/ansible-with-atl-env inv/aws_node_local ${DeploymentAutomationPlaybook} /var/log/ansible-bootstrap.log
              ignoreErrors: true
            090_add_ssh_keys:
              command: !Sub |
                aws s3 cp s3://${QSS3BucketName}/custom/authorized_keys /root/.ssh/authorized_keys
              ignoreErrors: true
            091_add_wipo_cer:
              command: !Sub |
                aws s3 sync s3://${QSS3BucketName}/custom/ /etc/pki/ca-trust/source/anchors/ --exclude "*" --include "*.cer"
              ignoreErrors: true
            092_update_ca_trust:
              command: !Sub |
                update-ca-trust
              ignoreErrors: true
            093_update_java_keystore:
              command: !Sub |
                for file in /etc/pki/ca-trust/source/anchors/*.cer; do keytool -import -keystore /usr/lib/jvm/temurin-21-jdk/lib/security/cacerts -keypass changeit -storepass changeit -noprompt -file $file; done
              ignoreErrors: true
            094_add_swap:
              command: fallocate -l 8G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
              ignoreErrors: true
            095_install_crowdstrike_agent:
              command: |
                . /etc/os-release
                if [ "$ID" = "amzn" ] && [ "$VERSION_ID" = "2023" ]; then
                  aws s3 cp s3://wipo-crowdstrike-bucket/crowdstrike.amzn2023.x86_64.sh - | xargs -0 bash -c
                else
                  aws s3 cp s3://wipo-crowdstrike-bucket/crowdstrike.amzn2.x86_64.sh - | xargs -0 bash -c
                fi
              ignoreErrors: true
    Properties:
      AssociatePublicIpAddress: false
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeSize: !Ref ClusterNodeVolumeSize
      IamInstanceProfile: !Ref BitbucketClusterNodeInstanceProfile
      ImageId: !FindInMap
        - AWSRegionArch2AMI
        - !Ref AWS::Region
        - HVM64
      InstanceType: !Ref ClusterNodeInstanceType
      SecurityGroups:
        - !Ref SecurityGroup
      UserData: !Base64
        Fn::Join:
          - ''
          - - |
              #!/bin/bash -xe
            - |
              source /etc/os-release
              if [[ "$ID" == "amzn" ]] && [[ "$VERSION_ID" == "2023" ]]; then
                dnf update -y aws-cfn-bootstrap amazon-ssm-agent
              else
                yum update -y aws-cfn-bootstrap amazon-ssm-agent
              fi
            - !Sub /opt/aws/bin/cfn-init -v --stack ${AWS::StackName}
            - !Sub |2
               --resource ClusterNodeLaunchConfig --region ${AWS::Region}
            - !Sub /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName}
            - !Sub |2
               --resource ClusterNodeGroup --region ${AWS::Region}
  ClusterNodeScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref ClusterNodeGroup
      Cooldown: '600'
      ScalingAdjustment: 1
  ClusterNodeScaleDownPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref ClusterNodeGroup
      Cooldown: '600'
      ScalingAdjustment: -1
  CPUAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scale up if CPU > 60% for 5 minutes
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 60
      AlarmActions:
        - !Ref ClusterNodeScaleUpPolicy
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref ClusterNodeGroup
      ComparisonOperator: GreaterThanThreshold
  CPUAlarmLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scale down if CPU < 40% for 30 minutes
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 60
      EvaluationPeriods: 30
      Threshold: 40
      AlarmActions:
        - !Ref ClusterNodeScaleDownPolicy
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref ClusterNodeGroup
      ComparisonOperator: LessThanThreshold
  
