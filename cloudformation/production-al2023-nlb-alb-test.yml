  OpenSearchSecure:
    Condition: UseFineGrainedAccessControlES
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - EIAMPolicyWildcardResource
          ignore_reasons:
            - EIAMPolicyWildcardResource: Intent assumed for initial migration.
    DependsOn:
      - ElasticsearchServiceRole
    Type: AWS::OpenSearchService::Domain
    Properties:
      EBSOptions:
        EBSEnabled: true
        VolumeSize: !Ref ElasticsearchNodeVolumeSize
        VolumeType: gp3
      EngineVersion: !Ref OpenSearchEngineVersion
      ClusterConfig:
        InstanceType: !Ref OpenSearchInstanceType
        InstanceCount: 3
        ZoneAwarenessEnabled: true
        ZoneAwarenessConfig:
          AvailabilityZoneCount: 3
      AccessPolicies:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action:
              - es:ESHttpDelete
              - es:ESHttpGet
              - es:ESHttpHead
              - es:ESHttpPatch
              - es:ESHttpPost
              - es:ESHttpPut
            Resource: '*'
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: bitbucket
          MasterUserPassword: !Ref ElasticSearchPassword
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      EncryptionAtRestOptions:
        Enabled: true
        KmsKeyId: !Ref ElasticsearchKMSKey
      NodeToNodeEncryptionOptions:
        Enabled: true
      VPCOptions:
        SubnetIds:
          - !Ref LbSubnet1
          - !Ref LbSubnet2
          - !Ref LbSubnet3
        SecurityGroupIds:
          - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Bitbucket OpenSearch cluster
        - Key: Application
          Value: !Ref AWS::StackId
  ElasticsearchKMSKey:
    Condition: UseFineGrainedAccessControlES
    Type: AWS::KMS::Key
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - EIAMPolicyWildcardResource
          ignore_reasons:
            - EIAMPolicyWildcardResource: Intent assumed for initial migration.
    Properties:
      Description: Encryption key for Elasticsearch cluster
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Id: !Sub ${AWS::StackName}
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:CancelKeyDeletion
              - kms:ConnectCustomKeyStore
              - kms:CreateAlias
              - kms:CreateCustomKeyStore
              - kms:CreateGrant
              - kms:CreateKey
              - kms:Decrypt
              - kms:DeleteAlias
              - kms:DeleteCustomKeyStore
              - kms:DeleteImportedKeyMaterial
              - kms:DescribeCustomKeyStores
