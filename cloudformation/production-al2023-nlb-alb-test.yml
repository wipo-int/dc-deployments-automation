                  - !Sub
                    - ATL_DB_ROOT_PASSWORD='${DBMasterUserPassword}'
                    - DBMasterUserPassword: !Ref DBMasterUserPassword
                  - !Sub
                    - ATL_DB_ENGINE=${DBEngine}
                    - DBEngine: !If
                        - DBEngineAurora
                        - aurora_postgres
                        - !If
                          - DBEnginePostgres
                          - rds_postgres
                          - ''
                  - !Sub
                    - ATL_DB_HOST=${DBEndpointAddress}
                    - DBEndpointAddress: !If
                        - DBEngineAurora
                        - !GetAtt DBCluster.Outputs.RDSEndPointAddress
