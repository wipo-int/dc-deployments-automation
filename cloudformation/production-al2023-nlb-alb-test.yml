                        - DBEngineAurora
                        - !Ref DBCluster
                        - !Ref DB
                  - !Sub
                    - ATL_RDS_INSTANCE_CLASS=${DBInstanceClass}
                    - DBInstanceClass: !Ref DBInstanceClass
                  - !Sub
                    - ATL_RDS_MULTI_AZ=${DBMultiAZ}
