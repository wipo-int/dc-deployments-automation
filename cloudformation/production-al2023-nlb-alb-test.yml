    Properties:
      Encrypted: true
      BackupPolicy:
        Status: ENABLED
      FileSystemTags:
        - Key: Name
          Value: !Join [' ', [!Ref 'AWS::StackName', 'cluster shared-files']]
        - Key: Application
          Value: !Ref AWS::StackId
        # NOTE: The leading COMMIT/TIMESTAMP are used to locate the position to update; see scripts/update-tags.py
        - Key: atl:quickstart:commit-id
          Value: 'COMMIT: 1ab73837b650a79665ca974ceb37e4088eee21b2'
        - Key: atl:quickstart:timestamp
          Value: 'TIMESTAMP: 2021-11-25T07:12:04Z'
        - Key: service
          Value: atlassian
  EFSMountAz1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ElasticFileSystem
      SecurityGroups: [!Ref SecurityGroup]
      SubnetId: !Ref LbSubnet1
  EFSMountAz2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ElasticFileSystem
      SecurityGroups: [!Ref SecurityGroup]
      SubnetId: !Ref LbSubnet2
  EFSMountAz3:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ElasticFileSystem
      SecurityGroups: [!Ref SecurityGroup]
      SubnetId: !Ref LbSubnet3
  # RDS
  DbInstanceName:
    Condition: DBEnginePostgres
    Type: Custom::DbInstanceName
    Version: 1
    Properties:
      ServiceToken: !GetAtt DBNameGenerator.Arn
      StackName: !Ref AWS::StackName
  DBNameGenerator:
    Condition: DBEnginePostgres
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt DBNameGeneratorExecutionRole.Arn
      Runtime: python3.12
      Timeout: 120
      Code:
        ZipFile: |
          import cfnresponse
          def lambda_handler(event, context):
            stack_name = event['ResourceProperties']['StackName']
            responseData = {}
            responseData['DBInstanceName'] = stack_name[:57] + "-db"
            cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
  DBNameGeneratorExecutionRole:
    Condition: DBEnginePostgres
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/*DBNameGenerator*
  DB:
    Type: AWS::RDS::DBInstance
    Condition: DBEnginePostgres
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - ERDSDBInstancePubliclyAccessible
          ignore_reasons:
            - ERDSDBInstancePubliclyAccessible: PubliclyAccessible defined by subnet configration
    Properties:
      AllocatedStorage: !Ref DBStorage
      AllowMajorVersionUpgrade: true
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: '30'
      DBInstanceClass: !Ref DBInstanceClass
      DBInstanceIdentifier: !GetAtt DbInstanceName.DBInstanceName
      DBName: !If
        - RestoreRDSOrStandby
        - !Ref AWS::NoValue
        - bitbucket
      DBSnapshotIdentifier: !If
        - RestoreFromRDSSnapshot
        - !Ref DBSnapshotId
        - !Ref AWS::NoValue
      DBSubnetGroupName: !Ref DBSubnetGroup
      DeletionProtection: true
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      Iops: !If
        - DBProvisionedIops
        - !Ref DBIops
        - !Ref AWS::NoValue
      MasterUsername: !If
        - SetDBMasterUserAndPassword
        - postgres
        - !Ref AWS::NoValue
      MasterUserPassword: !If
        - SetDBMasterUserAndPassword
        - !Ref DBMasterUserPassword
        - !Ref AWS::NoValue
      MultiAZ: !If
        - StandbyMode
        - !Ref AWS::NoValue
        - !Ref DBMultiAZ
      SourceDBInstanceIdentifier: !If
        - StandbyMode
        - !Ref DBMaster
        - !Ref AWS::NoValue
      StorageEncrypted: true
      StorageType: !If
        - DBProvisionedIops
        - io1
        - gp3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Bitbucket PostgreSQL Database
        - Key: service
          Value: atlassian
        - Key: schedule
          Value: 'no'
      VPCSecurityGroups:
        - !Ref SecurityGroup
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: DBEnginePostgres
    Properties:
      DBSubnetGroupDescription: DBSubnetGroup
      SubnetIds:
        - !Ref DbSubnet1ID
        - !Ref DbSubnet2ID
  DBCluster:
    Type: AWS::CloudFormation::Stack
    Condition: DBEngineAurora
    Properties:
      TemplateURL: !Sub
        - https://${QSS3BucketName}.${QSS3Region}.amazonaws.com/bitbucket/submodules/cfn-ps-atlassian-services/templates/quickstart-database-for-atlassian-services.yaml
        - QSS3Region: !If
            - GovCloudCondition
            - s3-us-gov-west-1
            - s3
      Parameters:
        DatabaseImplementation: !Ref DBEngine
        DBAllocatedStorage: !Ref DBStorage
        DBAutoMinorVersionUpgrade: 'true'
        DBBackupRetentionPeriod: '30'
        DBEngineVersion: !Ref DBEngineVersion
        DBInstanceClass: !Ref DBInstanceClass
        DBIops: !Ref DBIops
        DBMasterUserPassword: !Ref DBMasterUserPassword
        DBMultiAZ: !Ref DBMultiAZ
        DBSecurityGroup: !Ref SecurityGroup
        DBStorageEncrypted: true
        DBStorageType: !Ref DBStorageType
        ExportPrefix: !Ref ExportPrefix
        QSS3BucketName: !Ref QSS3BucketName
        QSS3KeyPrefix: !Ref QSS3KeyPrefix
  
  # TLS certificate for the stack-managed Route 53 hostname.
  ManagedBitbucketCertificate:
    Condition: GenerateSSLCertificate
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Join ['.', [!Ref 'AWS::StackName', !Ref HostedZone]]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Join ['.', [!Ref 'AWS::StackName', !Ref HostedZone]]
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Bitbucket TLS certificate

  # Application Load Balancer handles HTTP(S), TLS termination and Bitbucket session stickiness.
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: !If
        - UsePublicIp
        - internet-facing
        - internal
      SecurityGroups:
        - !Ref SecurityGroup
      Subnets:
        - !Ref LbSubnet1
        - !Ref LbSubnet2
        - !Ref LbSubnet3
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '3600'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Application Load Balancer
        - Key: Cluster
          Value: !Ref AWS::StackName

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: HTTP
      Port: 7990
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /status
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '300'
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: app_cookie
        - Key: stickiness.app_cookie.cookie_name
          Value: BITBUCKETSESSIONID
        - Key: stickiness.app_cookie.duration_seconds
          Value: '86400'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Bitbucket Web Targets

  ApplicationHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  ApplicationHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If
            - UseProvidedSSLCertificate
            - !Ref SSLCertificateARN
            - !Ref ManagedBitbucketCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  # NLB keeps one DNS endpoint for both HTTPS and Bitbucket SSH.
  NetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: !If
        - UsePublicIp
        - internet-facing
        - internal
      SecurityGroups:
        - !Ref SecurityGroup
      Subnets:
        - !Ref LbSubnet1
        - !Ref LbSubnet2
        - !Ref LbSubnet3
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Network Load Balancer
        - Key: Cluster
          Value: !Ref AWS::StackName

  NlbAlbHttpTargetGroup:
    DependsOn:
      - ApplicationHttpListener
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: TCP
      Port: 80
      TargetType: alb
      VpcId: !Ref VpcId
      Targets:
        - Id: !Ref ApplicationLoadBalancer
          Port: 80
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: '80'
      HealthCheckPath: /status
      Matcher:
        HttpCode: '200-399'

  NlbAlbHttpsTargetGroup:
    DependsOn:
      - ApplicationHttpsListener
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: TCP
      Port: 443
      TargetType: alb
      VpcId: !Ref VpcId
      Targets:
        - Id: !Ref ApplicationLoadBalancer
          Port: 443
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTPS
      HealthCheckPort: '443'
      HealthCheckPath: /status
      Matcher:
        HttpCode: '200-399'

  SshTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: TCP
      Port: 7999
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '300'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName} Bitbucket SSH Targets

  NetworkHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NetworkLoadBalancer
      Port: 80
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbAlbHttpTargetGroup

  NetworkHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NetworkLoadBalancer
      Port: 443
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbAlbHttpsTargetGroup

  NetworkSshListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NetworkLoadBalancer
      Port: 7999
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SshTargetGroup

  ManagedDnsRecord:
    Condition: CreateManagedDnsRecord
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Join ['.', [!Ref 'AWS::StackName', !Ref HostedZone]]
      Type: A
      AliasTarget:
        DNSName: !GetAtt NetworkLoadBalancer.DNSName
        HostedZoneId: !GetAtt NetworkLoadBalancer.CanonicalHostedZoneID

  # Route 53
  DnsBitbucketService:
    Type: 'AWS::ServiceDiscovery::Service'
    DependsOn:
      - NetworkLoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-git'
      NamespaceId: !Ref DnsNameSpaceId
      Description: 'bitbucket'
      DnsConfig:
        DnsRecords:
          - Type: 'CNAME'
            TTL: '60'
        RoutingPolicy: 'WEIGHTED'
      HealthCheckCustomConfig:
        FailureThreshold: 1
  DnsBitbucketServiceInstance:
    Type: 'AWS::ServiceDiscovery::Instance'
    DependsOn:
      - DnsBitbucketService
    Properties:
      InstanceId: 'bitbucket'
      ServiceId: !GetAtt DnsBitbucketService.Id
      InstanceAttributes:
        AWS_INSTANCE_CNAME: !GetAtt NetworkLoadBalancer.DNSName
  
  # EC2 SG
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group allowing SSH and HTTP/HTTPS access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref CidrBlock
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref CidrBlock
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref CidrBlock
        - IpProtocol: tcp
          FromPort: 25500
          ToPort: 25500
          CidrIp: '10.0.0.0/8'
        - IpProtocol: tcp
          FromPort: 5801
          ToPort: 5801
          CidrIp: '10.0.0.0/8'
        - IpProtocol: tcp
          FromPort: 8091
          ToPort: 8091
          CidrIp: '10.0.0.0/8'
        - IpProtocol: tcp
          FromPort: 7999
          ToPort: 7999
          CidrIp: !Ref CidrBlock
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '10.0.0.0/8'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '10.0.0.0/8'
      Tags:
        - Key: Name
          Value: !Join
            - ' '
            - - !Ref AWS::StackName
              - sg
      VpcId: !Ref VpcId
  SecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: '-1'
      FromPort: -1
      ToPort: -1
      SourceSecurityGroupId: !Ref SecurityGroup
  
  AnsibleRepoPinSHA:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The dc-deployments-automation commit SHA that all nodes in the cluster will use
      Name: !Sub /${AWS::StackName}/pinned-ansible-sha
      Type: String
      AllowedPattern: ^(latest)|([0-9a-f]{5,40})$
      Value: latest
  CloudWatchDashboard:
    Condition: EnableCloudWatch
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - https://${QSS3BucketName}.${QSS3Region}.amazonaws.com/bitbucket/submodules/cfn-ps-atlassian-services/templates/quickstart-cloudwatch-dashboard.yaml
        - QSS3Region: !If
            - GovCloudCondition
            - s3-us-gov-west-1
            - s3
      Parameters:
        ProductStackName: !Sub ${AWS::StackName}
        ProductFamilyName: bitbucket
        AsgToMonitor: !Ref ClusterNodeGroup

Outputs:
  ClusterNodeGroup:
    Description: The name of the auto scaling group of cluster nodes
    Value: !Ref ClusterNodeGroup
  DBEndpointAddress:
    Description: The Database Connection String
    Value: !If
      - DBEngineAurora
      - !GetAtt DBCluster.Outputs.RDSEndPointAddress
      - !GetAtt DB.Endpoint.Address
  DBMaster:
    Description: The RDS ARN to use when creating a Data Center standby stack
    Value: !If
      - DBEngineAurora
      - ''
      - !If
        - NotStandbyMode
        - !Sub
          - arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DB}
          - DB: !Ref DB
        - !Ref AWS::NoValue
  ServiceURL:
    Description: The URL of the Bitbucket Data Center instance
    Value: !If
      - UseCustomDnsName
      - !Join ['', ['https://', !Ref CustomDnsName]]
      - !Sub
        - https://${ManagedDnsName}
        - ManagedDnsName: !Join ['.', [!Ref 'AWS::StackName', !Ref HostedZone]]
  LoadBalancerURL:
    Description: The Network Load Balancer URL
    Value: !Sub
      - https://${NetworkLoadBalancerDNSName}
      - NetworkLoadBalancerDNSName: !GetAtt NetworkLoadBalancer.DNSName
  NetworkLoadBalancerDNSName:
    Description: DNS name of the Network Load Balancer used for HTTPS and SSH
    Value: !GetAtt NetworkLoadBalancer.DNSName
  ApplicationLoadBalancerDNSName:
    Description: DNS name of the internal Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ManagedDnsName:
    Condition: CreateManagedDnsRecord
    Description: Route 53 name created by this stack
    Value: !Join ['.', [!Ref 'AWS::StackName', !Ref HostedZone]]
  SGname:
    Description: The name of the SecurityGroup
    Value: !Ref SecurityGroup
    Export:
      Name: !Join
        - ''
        - - !Ref AWS::StackName
          - '-SGname'
  CloudWatchDashboardURL:
    Description: CloudWatch monitoring dashboard URL
    Value: !GetAtt CloudWatchDashboard.Outputs.Dashboard
    Condition: EnableCloudWatch
